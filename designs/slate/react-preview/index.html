<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slate — live component preview</title>

<!--
  Compiled React preview. Unlike the kitchen sink (../index.html, static HTML,
  no build), this page renders the real components/ui/*.tsx. They are compiled
  ahead of time into app.bundle.js by scripts/build-preview.mjs, so this page
  is self-contained: it opens on any static host, online or offline, with no
  CDN and no runtime transform. Rebuild the bundle with `npm run build:preview`
  after changing a component. See README.md.
-->

<!-- Tailwind: same vendored compiler + theme.css as the kitchen sink, so the
     React-rendered DOM is styled from the design's own tokens. -->
<style>html{visibility:hidden}</style>
<script>addEventListener("load", () => { document.documentElement.style.visibility = "visible"; });</script>
<script>
  fetch("../theme.css")
    .then((res) => { if (!res.ok) throw new Error("theme.css " + res.status); return res.text(); })
    .then((css) => {
      const theme = document.createElement("style");
      theme.type = "text/tailwindcss";
      theme.textContent = '@import "tailwindcss";\n' + css;
      document.head.append(theme);
      const tw = document.createElement("script");
      tw.src = "../../../vendor/tailwind-browser-4.3.3.js";
      document.head.append(tw);
    })
    .catch((err) => console.error(err));
</script>
</head>
<body>
<div id="root"></div>
<script src="app.bundle.js"></script>
</body>
</html>
